name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and test
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            cmake --preset default
            cmake --build --preset all
            ctest --preset all --output-on-failure
