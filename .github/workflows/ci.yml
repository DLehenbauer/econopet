name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  DEVCONTAINER_IMAGE: ghcr.io/dlehenbauer/econopet-devcontainer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Publish only from green builds of commits on main in this repository.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'DLehenbauer/econopet' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}
          runCmd: |
            set -e
            cmake --preset default
            cmake --build --preset all
            python3 -m unittest discover -s .github/scripts
            python3 .github/scripts/check-timing.py build/gw/outflow/EconoPET.timing.rpt
            ctest --preset all --parallel --output-on-failure

      # The steps below only run for a green build of a commit on main, because
      # a failed step above ends the job.

      # CMake names the package for the version and commit it was built from,
      # and includes 'build-info.yaml' in it, so the artifact is just what is
      # already in the build tree under a matching name.
      - name: Name SD card package
        id: package
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(build/sdcard/EconoPET-*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one build/sdcard/EconoPET-*.zip, found ${#zips[@]}."
            exit 1
          fi

          # GitHub wraps the artifact in '<name>.zip', so dropping the extension
          # here reproduces the CMake filename on download.
          zip_name=$(basename "${zips[0]}")
          echo "name=${zip_name%.zip}" >> "${GITHUB_OUTPUT}"

      # Uploading the package contents (rather than the zip built by CMake)
      # keeps the download a single unzip away from a ready-to-use SD card.
      #
      # Keep this the last step of the job so that the download URL it prints is
      # the last thing in the log.
      - name: Upload SD card package
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/sdcard/sdcard_root
          if-no-files-found: error
          # Allow a re-run of the same commit to replace its package.
          overwrite: true
