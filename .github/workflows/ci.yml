name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  DEVCONTAINER_IMAGE: ghcr.io/dlehenbauer/econopet-devcontainer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
          runCmd: |
            set -e
            cmake --preset default
            cmake --build --preset all
            ctest --preset all --output-on-failure
